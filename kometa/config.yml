playlist_files:
- default: playlist
  template_variables:
    libraries: Movies, TV Shows, 4k Movies, 4k TV Shows
    radarr_add_missing: false
    sonarr_add_missing: false
    delete_playlist_dragonball: false
settings:
  cache: true
  cache_expiration: 60
  asset_directory:
  - config/aura/anime
  - config/aura/movies
  - config/aura/movieskids
  - config/aura/movies4k
  - config/aura/tvshows
  - config/aura/tvshows4k
  - config/aura/tvshowskids
  asset_folders: true
  asset_depth: 6
  create_asset_folders: true
  prioritize_assets: true
  dimensional_asset_rename: true
  download_url_assets: true
  show_missing_season_assets: false
  show_missing_episode_assets: false
  show_asset_not_needed: false
  sync_mode: sync
  minimum_items: 2
  default_collection_order: null
  delete_below_minimum: true
  delete_not_scheduled: false
  run_again_delay: 1
  missing_only_released: true
  only_filter_missing: false
  show_unmanaged: true
  show_missing: false
  show_missing_assets: true
  save_report: true
  tvdb_language: eng
  ignore_ids: 33739,68295,46922,10318,64198,1668,443,2730,156902,2316,57532,2190,60554,14766,157747,1291091
  ignore_imdb_ids: null
  item_refresh_delay: 0
  playlist_sync_to_users: all
  playlist_exclude_users: null
  playlist_report: true
  verify_ssl: false
  custom_repo: null
  show_unconfigured: true
  overlay_artwork_filetype: jpg
  overlay_artwork_quality: 75
  show_unfiltered: false
  auto_sort_hubs: null
webhooks:
  error: <<NOTIFICATION_WEBHOOK>>
  version: <<NOTIFICATION_WEBHOOK>>
  run_start: <<NOTIFICATION_WEBHOOK>>
  run_end: <<NOTIFICATION_WEBHOOK>>
  changes: <<NOTIFICATION_WEBHOOK>>
  delete: <<NOTIFICATION_WEBHOOK>>
plex:
  url: <<PLEX_SERVER_URL>>
  token: <<PLEX_SERVER_TOKEN>>
  timeout: 360
  clean_bundles: false
  empty_trash: false
  optimize: false
  db_cache: null
  verify_ssl: false
tmdb:
  apikey: <<TMDB_APIKEY>>
  language: en
  cache_expiration: 60
  region: US
tautulli:
  url: <<TAUTULLI_URL>>
  apikey: <<TAUTULLI_APIKEY>>
omdb:
  apikey: <<OMDB_APIKEY>>
  cache_expiration: 60
mdblist:
  apikey: <<MDBLIST_APIKEY>>
  cache_expiration: 60
radarr:
  url: <<RADARR_URL>>
  token: <<RADARR_TOKEN>>
  add_missing: false
  add_existing: false
  root_folder_path: <<RADARR_ROOT_FOLDER>>
  monitor: false
  availability: announced
  quality_profile: SQP-1 (1080p)
  tag: kometa
  search: false
  radarr_path: <<RADARR_ROOT_FOLDER>>
  plex_path: <<RADARR_PLEX_PATH>>
  upgrade_existing: false
  monitor_existing: true
sonarr:
  url: <<SONARR_URL>>
  token: <<SONARR_TOKEN>>
  add_missing: false
  add_existing: false
  root_folder_path: <<SONARR_ROOT_FOLDER>>
  monitor: none
  quality_profile: WEB-DL (1080p)
  language_profile: English
  series_type: standard
  season_folder: true
  tag: kometa
  search: false
