    collection_files:
    - default: based
    - default: separator_chart
    - default: basic
    - default: universe
    - default: decade
    - default: imdb
    - default: genre
    - default: country
      template_variables:
        style: color
    - file: config/separator_franchise.yml
    - default: franchise
      template_variables:
        collection_section: '035'
    - default: seasonal
      template_variables:
        use_aapi: false
        use_disabilities: false
        use_black_history: false
        use_lgbtq: false
        use_latinx: false
    - file: config/movies_refresh.yml
    schedule_overlays: daily
    overlay_files:
    - default: resolution
    - default: audio_codec
    settings:
      asset_directory:
      - config/aura/movies
