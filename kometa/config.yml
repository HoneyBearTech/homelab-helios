# Kometa's configuration for Helios (Kometa v2.5.2). Every secret and host fact is a <<UPPER_SNAKE>> placeholder,
# which Kometa fills from the KOMETA_<UPPER_SNAKE> environment variable; the names and what each holds are in
# kometa.env.example. An unset placeholder silently becomes empty. Plex's placeholders are PLEX_SERVER_URL and
# PLEX_SERVER_TOKEN because Kometa reserves KOMETA_PLEX_URL and KOMETA_PLEX_TOKEN for its own use and never
# fills a placeholder from them.
libraries:
  Anime:
    report_path: config/missing/anime_report.yml
    remove_overlays: false
    reapply_overlays: false
    template_variables:
      sep_style: gray
      collection_mode: hide
      language: en
      placeholder_imdb_id: tt1190634
    collection_files:
    - default: separator_chart
    - default: basic
    - file: config/tv_refresh.yml
    schedule_overlays: weekly(sunday)
    overlay_files:
    - default: resolution
    - default: resolution
      template_variables:
        builder_level: episode
    - default: audio_codec
    - default: audio_codec
      template_variables:
        builder_level: season
    - default: streaming
    settings:
      asset_directory:
      - config/aura/anime
      prioritize_assets: true
    sonarr:
      url: <<SONARR_URL>>
      token: <<SONARR_TOKEN>>
      add_missing: false
      add_existing: false
      root_folder_path: <<ANIME_ROOT_FOLDER>>
      monitor: none
      quality_profile: Anime
      language_profile: English
      series_type: anime
      season_folder: true
      tag: kometa
      search: false
      cutoff_search: false
      sonarr_path: <<ANIME_ROOT_FOLDER>>
      plex_path: <<ANIME_PLEX_PATH>>
      upgrade_existing: false
      monitor_existing: false
    operations:
    - schedule: daily
      split_duplicates: false
      assets_for_all: true
      delete_collections:
        configured: false
        managed: false
  Movies:
    report_path: config/missing/movies_report.yml
    remove_overlays: false
    reapply_overlays: false
    template_variables:
