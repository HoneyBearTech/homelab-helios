# The host's NVIDIA GPU for Plex's hardware transcoding (NVENC/NVDEC), as a device reservation through the NVIDIA
# Container Toolkit, never by running Plex privileged. Kept out of compose.yaml so the stack also starts on a
# machine without a GPU (CI). On the host: COMPOSE_FILE=compose.yaml:compose.gpu.yaml in .env. Hardware
# transcoding also needs a Plex Pass on the server's Plex account. Needs Docker Engine 29.2+ and NVIDIA Container
# Toolkit 1.18+: from 29.2 Docker serves `driver: nvidia` through CDI. On an older Engine (NVIDIA's runtime hook)
# Plex loses the GPU at every `systemctl daemon-reload` (docs/installing.md#the-gpu-and-docker-292).

services:
  plex:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
