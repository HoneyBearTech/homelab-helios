name: Dependabot auto-merge

# Turns on GitHub's auto-merge for Dependabot's patch and minor update PRs, so they're squash-merged once every
# required check passes (the main ruleset still decides: CI with the Compose policy check, CodeQL, dependency
# review, signed commits). Nothing is checked out or run from the PR; the job only reads Dependabot's metadata
# and calls `gh`. A merge changes main only: a server picks it up when its operator pulls and redeploys
# (docs/upgrading.md), never by itself.
on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'HoneyBearTech/homelab-helios'
    # Only this job writes, to turn on auto-merge for the PR.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Images, Python tools and Actions: patch and minor updates. Major updates (and any update Dependabot can't
      # classify, such as a tag scheme it doesn't read as a version) wait for the maintainer: a new major app
      # version can migrate its database one way.
      - name: Enable auto-merge for patch and minor updates
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
