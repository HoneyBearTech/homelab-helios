name: Kometa upstream watch

# Weekly: is there a Kometa release newer than the one pinned in compose.yaml, does kometa/ validate against it,
# and what changed upstream that our configuration uses? Keeps one issue, "Kometa upstream changes", up to date
# (scripts/kometa_watch.py): unchanged findings edit nothing, new ones update it with one comment and the optional
# alert, and it's closed once the pin is the latest release again. Dependabot proposes the update itself; this is
# the early warning with the release notes and the defaults' diff. Changes nothing in the repository.
on:
  schedule:
    - cron: "23 5 * * 1" # Mondays, 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

# Two runs at once could both create the issue.
concurrency:
  group: kometa-upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Watch Kometa releases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Only this job writes, and only issues: it opens, edits, comments on and closes its own.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # The alert secrets are optional: when one isn't set, its variable is empty and no alert goes there. Release
      # notes and diffs (untrusted text) reach only the issue, through the script, never a shell.
      - name: Compare with Kometa's latest release and update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python scripts/kometa_watch.py
