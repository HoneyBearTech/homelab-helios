# Broken on purpose: refresh.yml has a key Kometa doesn't know, which Kometa itself only reports. The
# check must still fail (CI checks it does).
libraries:
  Movies:
    collection_files:
    - file: config/refresh.yml
plex:
  url: <<PLEX_SERVER_URL>>
  token: <<PLEX_SERVER_TOKEN>>
tmdb:
  apikey: <<TMDB_APIKEY>>
  language: en
