# The Helios stack. Every setting comes from .env (template: .env.example; reference: docs/interfaces.md); the
# secrets a service can only take from its environment from plex.env (Plex's one-time claim token) and
# autoheal.env (autoheal's optional webhook), both optional and gitignored; the Dozzle agent's certificate and key
# from files under CONFIG_ROOT/dozzle/certs (Docker secrets, at the end).
# Every image is pinned as name:tag@sha256:<digest>; Dependabot proposes updates (patch, minor and major ones
# merge automatically once CI passes; a merge deploys). scripts/check_compose.py enforces the policy
# (docs/security.md#policy).
# The NVIDIA GPU for Plex is in compose.gpu.yaml, so the stack also starts without one (CI has none); the host
# adds it with COMPOSE_FILE in .env.
# Each app's data lives in host directories under CONFIG_ROOT: CONFIG_ROOT/<service>/config at the app's data path,
# and any other folder of the app's beside it (CONFIG_ROOT/plex/cache, CONFIG_ROOT/plex/transcode). No app data is
# in a named Docker volume, and CONFIG_ROOT must never point into /var/lib/docker/volumes: `docker volume prune`
# deletes a volume no container mounts as a volume, even one whose _data folder a service bind-mounts
# (docs/installing.md#where-data-lives).

name: homelab-helios

# Every service starts with no Linux capabilities and can't gain privileges (setuid binaries, file capabilities);
# a service that needs a capability adds back only that one, from Docker's default set (docs/security.md#hardening).
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-linuxserver-env: &linuxserver-env
  PUID: ${PUID:?set PUID in .env}
  PGID: ${PGID:?set PGID in .env}
  TZ: ${TZ:?set TZ in .env}
  UMASK: ${UMASK:-002}

# Health check timing shared by every service; each service adds its own test. During start_period a failing
# check doesn't count, and Docker checks every start_interval so a healthy service shows up within seconds. The
# long start_period keeps autoheal from restarting a service in the middle of a slow database migration after an
# upgrade (Plex's can take minutes).
x-healthcheck: &healthcheck
  interval: 1m
  timeout: 10s
  retries: 3
  start_period: 10m
  start_interval: 5s

# On every service: autoheal may restart it when its health check fails, and an auto-updater running on the same
# host (Watchtower) leaves it alone, so the pinned version is the one that runs.
x-labels: &labels
  autoheal: "true"
  com.centurylinklabs.watchtower.enable: "false"

services:
  # Serves the media library to Plex apps. It runs on the stack's network with only 32400 published (players find
  # it through plex.tv; Docker keeps the client's address, so Plex's LAN settings still apply). VERSION=docker
  # makes the image run the Plex it ships with instead of downloading the newest one at every start.
  plex:
    <<: *hardened
    # The build tag: Dependabot can't read any of Plex's tags (the version carries a commit hash), so Plex updates
    # are made by hand (docs/dependencies.md).
    image: lscr.io/linuxserver/plex:1.43.5.11029-6bf8af3f0-ls329@sha256:8f655bad7dcbc5398a78f70a5af12600b4ed3424f901566ed1eaa6710e9e2334
    container_name: plex
    restart: unless-stopped
    # Its root filesystem stays writable: the init (s6-overlay) rewrites /etc/passwd to give abc PUID/PGID, and on a
    # read-only root it ignores PUID/PGID and runs as uid 911, which doesn't own the data.
    # Its init (s6-overlay) runs as root and starts Plex as abc (PUID/PGID), so it needs these of Docker's default
    # capabilities. Each is proven by the smoke test or by starting the image without it.
    cap_add:
      - CHOWN # takes ownership of /config (a new server: Plex can't start without it)
      - DAC_OVERRIDE # reads Preferences.xml (mode 600, abc's) and removes a stale pid file after an unclean stop
      - SETUID # starts Plex as abc
      - SETGID
      - KILL # signals Plex (abc) to stop; without it every stop waits for Docker's timeout and kills Plex
    labels:
      <<: *labels
      # The library is too large to back up here (the storage that holds it keeps snapshots); the cache and
      # transcodes in progress are disposable.
      org.honeybeartech.helios.backup.skip: >-
        /media,/config/Library/Application Support/Plex Media Server/Cache,/transcode
      # Artwork (Metadata, 59 GB on Helios) and preview thumbnails (Media) are left out of /config's archive, which
      # keeps the databases and settings: after a restore, Plex, AURA and Kometa download and apply the artwork again.
      org.honeybeartech.helios.backup.exclude: >-
        /config/Library/Application Support/Plex Media Server/Metadata,
        /config/Library/Application Support/Plex Media Server/Media
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:32400/identity"]
    environment:
      <<: *linuxserver-env
      VERSION: docker
    # PLEX_CLAIM, for a new server's first start only (template: plex.env.example).
    env_file:
      - path: plex.env
        required: false
    ports:
      - "32400:32400"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/plex/config:/config
      - type: bind
        source: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/plex/cache
        target: /config/Library/Application Support/Plex Media Server/Cache
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/plex/transcode:/transcode
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  # Watches Plex: activity, history, statistics and notifications.
  tautulli:
    <<: *hardened
    image: lscr.io/linuxserver/tautulli:version-v2.18.2@sha256:986125e67ab881504e6a71f93f8fe0932de0e1158f3060b53ca9d12ab38fa3be
    container_name: tautulli
    restart: unless-stopped
    # Its root filesystem stays writable: the init (s6-overlay) rewrites /etc/passwd to give abc PUID/PGID, and on a
    # read-only root it ignores PUID/PGID and runs as uid 911, which doesn't own the data.
    # Its init (s6-overlay) runs as root and starts Tautulli as abc (PUID/PGID), so it needs these of Docker's
    # default capabilities. Each is proven by the smoke test or by starting the image without it.
    cap_add:
      - CHOWN # takes ownership of /config (new data: Tautulli can't start without it)
      - SETUID # starts Tautulli as abc
      - SETGID
      - KILL # signals Tautulli (abc) to stop; without it every stop waits for Docker's timeout and kills it
    labels: *labels
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8181/status"]
    environment: *linuxserver-env
    ports:
      - "8181:8181"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/tautulli/config:/config

  # MediUX's artwork manager: browse artwork sets and apply them to Plex, saving artwork next to the media or
  # writing sets for Kometa. The media is mounted at the same path as in Plex, as AURA requires.
  aura:
    <<: *hardened
    image: ghcr.io/mediux-team/aura:v0.9.112@sha256:aabb1ffbaaabf505489ea8785807d4a42ea2d8df2a6acc609a6e99585c1c7fa5
    container_name: aura
    restart: unless-stopped
    # Writes only its data and temporary files: the image itself stays read-only.
    read_only: true
    tmpfs:
      - /tmp
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    labels:
      <<: *labels
      # The library isn't backed up here; /kometa is part of Kometa's data and backed up with it.
      org.honeybeartech.helios.backup.skip: /media,/kometa
    healthcheck:
      <<: *healthcheck
      # The API (8888) and the web UI (3000) both answer.
      test:
        - CMD-SHELL
        - wget -qO /dev/null http://127.0.0.1:8888/api/health && wget -qO /dev/null http://127.0.0.1:3000/
    environment:
      TZ: ${TZ:?set TZ in .env}
    ports:
      - "3000:3000"
      - "8888:8888"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/aura/config:/config
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/kometa/config/aura:/kometa
      - ${MEDIA_PATH:?set MEDIA_PATH in .env}:/media

  # Builds collections and overlays in Plex and applies artwork and metadata (including the sets AURA writes), on
  # its daily schedule. Its config.yml and collection files come from kometa/ in this checkout, mounted read-only
  # over the copies in its data directory; their placeholders are filled from the .env Kometa reads in its data
  # directory (kometa.env.example). Logs, cache, assets and overlays stay in the data directory. A single-file
  # mount keeps the old file after a git pull until the container is recreated, which the pull agent's up -d
  # doesn't do for a change to kometa/ only (docs/upgrading.md).
  kometa:
    <<: *hardened
    image: kometateam/kometa:v2.5.3@sha256:48c3cb318ec984213587f221e8e762c5ad2dbd0e6966efc7bba0a5868a6c5758
    container_name: kometa
    restart: unless-stopped
    # Writes only its data and temporary files: the image itself stays read-only.
    read_only: true
    tmpfs:
      - /tmp
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    labels:
      <<: *labels
      # AURA's artwork, backed up with AURA's data.
      org.honeybeartech.helios.backup.skip: /auraassets
      # Downloaded assets, which Kometa downloads again; overlays/ (the original posters it needs to remove an overlay)
      # is kept.
      org.honeybeartech.helios.backup.exclude: /config/assets
    healthcheck:
      <<: *healthcheck
      # Kometa's own process (not tini, PID 1) is alive; the image has no pgrep.
      test:
        - CMD
        - /.venv/bin/python3
        - -c
        - >-
          import os, sys;
          sys.exit(not any(p != "1" and b"kometa.py\0" in open(f"/proc/{p}/cmdline", "rb").read()
          for p in os.listdir("/proc") if p.isdigit()))
    environment:
      TZ: ${TZ:?set TZ in .env}
      KOMETA_TIMES: ${KOMETA_TIMES:-07:30}
      # config.yml is mounted read-only: without this, Kometa tries to add a missing setting to it and the run
      # stops (still exiting 0). With it, Kometa uses the setting's default and logs a warning.
      KOMETA_READ_ONLY_CONFIG: "true"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/kometa/config:/config
      - ./kometa/config.yml:/config/config.yml:ro
      - ./kometa/movies_refresh.yml:/config/movies_refresh.yml:ro
      - ./kometa/tv_refresh.yml:/config/tv_refresh.yml:ro
      - ./kometa/separator_franchise.yml:/config/separator_franchise.yml:ro
      - ./kometa/radarr4k_tags.yml:/config/radarr4k_tags.yml:ro
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/aura/config/auraassets:/auraassets

  # Kometa Quickstart: a web UI for building and validating Kometa configurations. A tool, started on demand and
  # not by `docker compose up -d`: `docker compose --profile tools up -d quickstart`, then
  # `docker compose stop quickstart` when done. It has no login, and its data (SQLite) holds the Plex token and
  # API keys entered in it, so anyone who can reach port 7171 while it runs can read them (docs/security.md).
  # Its configs hold real values: they reach kometa/ only through the placeholders. Its own Kometa and ImageMaid
  # runs and its self-updater download unpinned code from GitHub; the stack's pinned Kometa and ImageMaid do that
  # work instead (docs/kometa-quickstart.md).
  quickstart:
    <<: *hardened
    image: kometateam/quickstart:v0.10.14@sha256:3b738f5ca494ec098bfe90cf6899968e60a824b85cf35d43302a18f301d31640
    container_name: quickstart
    profiles: [tools]
    # Not restarted after a reboot: it is reachable without a login only while someone has it running.
    restart: "no"
    # Writes only its data and temporary files: the image itself stays read-only.
    read_only: true
    tmpfs:
      - /tmp
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    labels:
      <<: *labels
    healthcheck:
      <<: *healthcheck
      # The image's own check: its status endpoint answers.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7171/kometa-status"]
    environment:
      TZ: ${TZ:?set TZ in .env}
    ports:
      - "7171:7171"
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/quickstart/config:/config

  # Removes images Plex no longer uses from Plex's data directory, on its schedule. Its .env (Plex's address and
  # token, the mode, notifications) lives in its data directory; the schedule and Plex's path come from here.
  imagemaid:
    <<: *hardened
    image: kometateam/imagemaid:v1.2.2@sha256:2a425468a2527860141edb5e1d1ac7c97ccc509bd7f3287212d95dbb18428ac3
    container_name: imagemaid
    restart: unless-stopped
    # Writes only its data and temporary files: the image itself stays read-only.
    read_only: true
    tmpfs:
      - /tmp
    user: ${PUID:?set PUID in .env}:${PGID:?set PGID in .env}
    # Plex creates the directories ImageMaid works in.
    depends_on:
      plex:
        condition: service_healthy
    labels:
      <<: *labels
      # Plex's data, backed up (or, for the cache, skipped) with Plex.
      org.honeybeartech.helios.backup.skip: /plex,/plex/Cache
    healthcheck:
      <<: *healthcheck
      # ImageMaid's own process (not tini, PID 1) is alive; the image has no pgrep.
      test:
        - CMD
        - python3
        - -c
        - >-
          import os, sys;
          sys.exit(not any(p != "1" and b"imagemaid.py\0" in open(f"/proc/{p}/cmdline", "rb").read()
          for p in os.listdir("/proc") if p.isdigit()))
    environment:
      TZ: ${TZ:?set TZ in .env}
      PLEX_PATH: /plex
      SCHEDULE: ${IMAGEMAID_SCHEDULE:?set IMAGEMAID_SCHEDULE in .env}
    volumes:
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/imagemaid/config:/config
      - type: bind
        source: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/plex/config/Library/Application Support/Plex Media Server
        target: /plex
      - ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/plex/cache:/plex/Cache

  # A Dozzle agent: it serves this host's container logs to the homelab's Dozzle on another host, which shows the
  # logs of every host in one web UI. It has no web UI of its own and no data to back up. Keep it on the hub's
  # version. It accepts only a hub that presents the homelab's own certificate and key (the secrets at the end), never
  # the pair built into every Dozzle image, which anyone can use.
  dozzle-agent:
    <<: *hardened
    image: amir20/dozzle:v11.3.4@sha256:8796ae7e1ecbe011482319cb7040e69aae91a0632b87bbe24b3f643e7455d94b
    container_name: dozzle-agent
    restart: unless-stopped
    # Writes nothing outside temporary files: the image itself stays read-only. /data holds the notification settings
    # the Dozzle hub sends it, in memory: the hub keeps them itself and sends them again each time it starts.
    read_only: true
    tmpfs:
      - /tmp
      - /data
    command: agent
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "/dozzle", "healthcheck"]
    labels:
      <<: *labels
      org.honeybeartech.helios.allow.docker-socket: >-
        The Dozzle agent reads container logs through the Docker API for the Dozzle hub. The socket is mounted
        read-only, which protects the socket file but not the API, so the agent's port must stay on the LAN.
    environment:
      DOZZLE_CERT: /run/secrets/dozzle_cert
      DOZZLE_KEY: /run/secrets/dozzle_key
    secrets:
      - dozzle_cert
      - dozzle_key
    ports:
      - "7007:7007"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # Restarts any container labelled autoheal: "true" that Docker reports unhealthy (Docker itself only restarts a
  # container whose process exits). It reaches Docker only through socket-proxy, which lets it list, inspect,
  # restart and stop containers and nothing else. Optional restart notices go to a webhook from autoheal.env.
  autoheal:
    <<: *hardened
    image: willfarrell/autoheal:latest@sha256:e7f42d5365c7c4490dd0cafc2858bb9fd2d64a274448d2de2bb5c386f1af7a0f
    container_name: autoheal
    restart: unless-stopped
    read_only: true
    # autoheal exits if it can't reach the proxy, so it starts only once the proxy answers. (After a host reboot
    # Docker starts both at once; autoheal then restarts until the proxy is up, a few seconds.)
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "pgrep", "-f", "autoheal"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      org.honeybeartech.helios.allow.latest: >-
        The image publishes "latest" (rebuilt regularly) and versioned tags only up to 1.2.0 from 2021, so the
        maintained image is "latest", pinned by digest.
    environment:
      DOCKER_SOCK: tcp://socket-proxy:2375
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 10
      # Give a service time to shut down cleanly (and finish database writes) before it's restarted.
      AUTOHEAL_DEFAULT_STOP_TIMEOUT: 30
      # Discord's webhook API reads the message from "content".
      WEBHOOK_JSON_KEY: content
    env_file:
      - path: autoheal.env
        required: false
    networks:
      - default
      - docker-proxy

  # Holds the Docker socket on autoheal's behalf (the only other service with the socket is the Dozzle agent, which
  # reads logs). It answers on an internal network with no published port, and passes on only what autoheal needs:
  # listing and inspecting containers, and restarting or stopping them (CONTAINERS, ALLOW_RESTARTS). Creating,
  # starting or deleting containers, exec, images, volumes and every other POST are refused.
  socket-proxy:
    <<: *hardened
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /run
      - /tmp
    healthcheck:
      <<: *healthcheck
      start_period: 1m
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2375/_ping"]
    labels:
      <<: *labels
      org.honeybeartech.helios.allow.docker-socket: >-
        A filtering proxy so that autoheal never gets the socket itself: it allows only listing, inspecting,
        restarting and stopping containers, on an internal network with no published port. The socket mount is
        read-only, which protects the socket file but not the API; the proxy's filter is what limits it.
    environment:
      CONTAINERS: 1
      ALLOW_RESTARTS: 1
      POST: 0
      EVENTS: 0
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-proxy

networks:
  # autoheal ↔ socket-proxy only: no route out, nothing published.
  docker-proxy:
    internal: true

# The certificate and key the Dozzle agent and the homelab's Dozzle hub authenticate each other with: one pair, made
# once with `dozzle generate-certs`, the same on the hub and on every agent (docs/installing.md#dozzles-certificate).
# Files on the host, owned by root: the agent runs as root without capabilities, so it can read only a file that root
# owns. Compose mounts each read-only at /run/secrets/<name>, and the agent doesn't start while one is missing, so it
# never falls back to the built-in pair. Never committed, and never in the stack's backups (they copy read-write
# mounts only): keep the key in a password manager.
secrets:
  dozzle_cert:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_cert.pem
  dozzle_key:
    file: ${CONFIG_ROOT:?set CONFIG_ROOT in .env}/dozzle/certs/dozzle_key.pem
