# The host's Intel GPU for Plex's hardware transcoding (Quick Sync / VA-API): an Arc card or an integrated GPU on the
# i915 or xe driver. Intel has no Compose device reservation like NVIDIA's, so Plex gets the host's /dev/dri as a
# device mapping (never by running Plex privileged); the image's init adds Plex's user to the groups that own the
# device nodes. Kept out of compose.yaml so the stack also starts on a machine without a GPU (CI). On the host:
# COMPOSE_FILE=compose.yaml:compose.intel.yaml in .env, or compose.host-gpu.yaml, which scripts/select-gpu.sh points
# at the override for the GPU the host has at boot (docs/installing.md#the-gpu-at-boot). Hardware transcoding also
# needs a Plex Pass on the server's Plex account, and Plex's Transcoder setting "Hardware transcoding device" on Auto
# or on this GPU.

services:
  plex:
    devices:
      - /dev/dri:/dev/dri
    labels:
      org.honeybeartech.helios.allow.devices: >-
        Intel GPU for hardware transcoding: Intel has no device reservation, so its DRM nodes are mapped instead
